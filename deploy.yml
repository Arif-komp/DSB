name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # Pastikan ini adalah cabang utama Anda

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup Flutter (Menggunakan versi stabil terbaru untuk kompatibilitas)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Ganti dengan versi Flutter yang Anda gunakan, misal 3.16.x
          flutter-version: '3.16.x' 

      # 1. Build Web dengan Base Href yang Diperbarui
      - name: Flutter build web
        # Base Href diatur sesuai dengan nama repositori Anda
        run: flutter build web --web-renderer html --base-href /DSB/ 
      
      # 2. Deploy ke GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages # Target branch untuk GitHub Pages
